menubar:
  - label: "File"
    items:
      - command: "file.new"
      - command: "file.open"
      - command: "file.save"
      - separator: true
      - command: "file.export_bom"
      - command: "file.export_wirelist"
      - separator: true
      - command: "file.exit"

  - label: "Edit"
    items:
      - command: "edit.undo"
      - command: "edit.redo"
      - separator: true
      - command: "edit.rotate_cw"
      - command: "edit.rotate_ccw"
      - command: "edit.delete"

  - label: "Tools"
    items:
      - command: "tool.select"
      - command: "tool.move"
      - command: "tool.wire"
      - separator: true
      - command: "tool.add_generic_device"
      - command: "device.create_wizard"
      - command: "tool.measure"

  - label: "View"
    items:
      - command: "view.zoom_extents"
      - command: "view.zoom_selected"
      - separator: true
      - command: "view.toggle_project_browser"
      - command: "view.toggle_property_panel"
      - command: "view.toggle_library"  # <--- HOOKED UP
      - separator: true
      - command: "view.reset_layout"
        
toolbar:
  visible: true
  items:
    - command: "tool.select"
    - command: "tool.move"
    - command: "tool.wire"
    - separator: true
    - command: "tool.add_generic_device"
    - command: "device.create_wizard"
    - separator: true
    - command: "edit.undo"
    - command: "edit.redo"

context_menu:
  device:
    - command: "edit.move"
    - command: "edit.rotate_cw"
    - separator: true
    - command: "edit.delete"
  wire:
    - command: "edit.delete"
