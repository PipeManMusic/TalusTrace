menubar:
  - label: "File"
    items:
      - command: "file.new"
        label: "file.new"
      - command: "file.open"
        label: "file.open"
      - command: "file.save"
        label: "file.save"
      - separator: true
      - command: "file.export_bom"
        label: "file.export_bom"
      - command: "file.export_wirelist"
        label: "file.export_wirelist"
      - separator: true
      - command: "file.exit"
        label: "file.exit"

  - label: "Edit"
    items:
      - command: "edit.undo"
        label: "edit.undo"
      - command: "edit.redo"
        label: "edit.redo"
      - separator: true
      - command: "edit.settings"
        label: "edit.settings"
      - command: "edit.theme"
        label: "edit.theme"

  - label: "Tools"
    items:
      - command: "tool.move"
        label: "tool.move"
      - command: "tool.add_generic_device"
        label: "tool.add_generic_device"
      - command: "device.create_wizard"
        label: "device.create_wizard"
      - command: "tool.measure"
        label: "tool.measure"

  - label: "View"
    items:
      - command: "view.zoom_extents"
        label: "view.zoom_extents"
      - command: "view.zoom_selected"
        label: "view.zoom_selected"
      - separator: true
      - command: "view.toggle_project_browser"
        label: "view.toggle_project_browser"
      - command: "view.toggle_property_panel"
        label: "view.toggle_property_panel"
      - command: "view.toggle_library"
        label: "view.toggle_library"
      - command: "view.toggle_audit_panel"
        label: "view.toggle_audit_panel"
      - separator: true
      - command: "view.reset_layout"
        label: "view.reset_layout"
        
keymap:
  cancel: Key_Escape
toolbar:
  visible: true
  items:
    - command: "tool.move"
    - command: "tool.add_generic_device"
    - command: "device.create_wizard"
    - separator: true
    - command: "edit.undo"
    - command: "edit.redo"

context_menu:
  canvas:
    - command: "tool.add_generic_device"
  device:
    - command: "device.add_pin"
    - separator: true
    - command: "edit.rotate_cw"
    - separator: true
    - command: "edit.delete"
      label: "Delete Item"
  wire:
    - command: "edit.delete"
  pin:
    - command: "edit.delete"