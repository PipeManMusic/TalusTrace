menubar:
  - label: "File"
    items:
      - command: "file.new"
        label: "New"
      - command: "file.open"
        label: "Open File"
      - command: "file.save"
        label: "Save File"
      - separator: true
      - command: "file.export_bom"
        label: "Export BOM"
      - command: "file.export_wirelist"
        label: "Export Wirelist"
      - separator: true
      - command: "file.exit"
        label: "Exit"

  - label: "Edit"
    items:
      - command: "edit.undo"
        label: "Undo"
      - command: "edit.redo"
        label: "Redo"
      - separator: true
      - command: "edit.settings"
        label: "Settings"
      - command: "edit.theme"
        label: "Theme"

  - label: "Tools"
    items:
      - command: "tool.move"
        label: "Move"
      - command: "tool.add_generic_device"
        label: "Add Generic Device"
      - command: "device.create_wizard"
        label: "Device Wizard"
      - command: "tool.measure"
        label: "Measure"

  - label: "View"
    items:
      - command: "view.zoom_extents"
        label: "Zoom Extents"
      - command: "view.zoom_selected"
        label: "Zoom Selected"
      - separator: true
      - command: "view.toggle_project_browser"
        label: "Toggle Project Browser"
      - command: "view.toggle_property_panel"
        label: "Toggle Property Panel"
      - command: "view.toggle_library"
        label: "Toggle Library"
      - command: "view.toggle_audit_panel"
        label: "Toggle Audit Panel"
      - separator: true
      - command: "view.reset_layout"
        label: "Reset Layout"
        
keymap:
  cancel: Key_Escape
toolbar:
  visible: true
  items:
    - command: "tool.move"
      label: "Move"
    - command: "tool.add_generic_device"
      label: "Add Generic Device"
    - command: "device.create_wizard"
      label: "Device Wizard"
    - separator: true
    - command: "edit.undo"
      label: "Undo"
    - command: "edit.redo"
      label: "Redo"

context_menu:
  device:
    - command: "device.add_pin"
    - separator: true
    - command: "edit.rotate_cw"
    - separator: true
    - command: "edit.delete"
  wire:
    - command: "edit.delete"