commands:
  # --- Tools ---
  - id: tool.add_generic_device
    uuid: f1831bfa-9f66-461c-8a1d-6c5440dc314b
    icon: device.svg
    tooltip: Place a generic device on the canvas
  - id: device.add_pin
    uuid: 7a1e2b3c-4d5e-678f-9012-abcdefabcdef
    icon: pin.svg
    tooltip: Add a pin to the device
  - id: tool.select
    icon: select.svg
    default_key: S
  - id: tool.move
    icon: move.svg
    default_key: G
    tooltip: Grab/Move Selection
  - id: tool.wire
    icon: wire.svg
    default_sequence:
      - W
      - A
  - id: tool.measure
    icon: ruler.svg
    default_sequence:
      - M
      - E
  - id: device.create_wizard
    icon: wizard.svg

  # --- Edit ---
  - id: edit.rotate_cw
    uuid: 4a88e033-860e-4b9b-9140-338b49c40e61
    icon: rotate_cw.svg
    default_key: Space
  - id: edit.rotate_ccw
    icon: rotate_ccw.svg
    default_key: Shift+Space
  - id: edit.delete
    uuid: e5f01b07-dd65-4fbc-9d0f-59b83cdc0a0b
    icon: trash.svg
    default_key: Delete
  - id: edit.undo
    icon: undo.svg
    default_key: Ctrl+Z
  - id: edit.redo
    icon: redo.svg
    default_key: Ctrl+Shift+Z

  # --- View ---
  - id: view.zoom_extents
    icon: zoom_all.svg
    default_sequence:
      - Z
      - E
  - id: view.zoom_selected
    icon: zoom_sel.svg
    default_sequence:
      - Z
      - S
  - id: view.toggle_grid
    icon: grid.svg
  - id: view.toggle_property_panel
    icon: panel.svg
    default_key: Tab
  - id: view.toggle_project_browser
    icon: browser.svg
  - id: view.toggle_library
    icon: library.svg
  - id: view.reset_layout
    icon: reset.svg

  # --- File ---
  - id: file.new
    icon: new.svg
    default_key: Ctrl+N
  - id: file.open
    icon: open.svg
    default_key: Ctrl+O
  - id: file.save
    icon: save.svg
    default_key: Ctrl+S
  - id: file.exit
    default_key: Alt+F4
  - id: file.export_bom
    icon: bom.svg
    tooltip: Generate Bill of Materials
  - id: file.export_wirelist
    icon: wirelist.svg
    tooltip: Generate Wire Cut List
