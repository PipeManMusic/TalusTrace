  # ──────────────────────────────────────────────────
  # DIN 72551-6 / ISO 6722 — FLRY-B Thin Wall
  # European metric automotive wire
  # Colors per DIN 72551 standard color code
  # ──────────────────────────────────────────────────

  FLRY-0.35:
    label: "0.35mm² Signal (22 AWG equiv)"
    description: "Low current sensor signals, ECU logic, and LED indicators."
