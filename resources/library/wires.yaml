    gauge: 0.35mm²
    cross_section_mm2: 0.35
    od_mm: 1.30
    resistance_ohm_m: 0.0520
    max_amps: 5
    weight_g_m: 5.0
    color_code: vi    # violett — signal/data
    color_hex: "#8B008B"

  FLRY-0.50:
    label: "0.50mm² General (20 AWG equiv)"
    description: "Standard relay triggers, sensors, and instrument cluster wiring."
