wires:

  # ──────────────────────────────────────────────────
  # SAE J1128 / GPT — Standard Automotive Primary Wire
  # Common North American automotive wire gauges
  # Colors follow DIN 72551 color code conventions
  # ──────────────────────────────────────────────────

  GPT-22:
    label: "22 AWG (0.34mm²)"
    description: "Low-current signals, sensors, ECU data lines, LED indicators."
    family: SAE J1128 GPT
    gauge: 22 AWG
    cross_section_mm2: 0.34
    od_mm: 1.60
    resistance_ohm_m: 0.0530
    max_amps: 5
    weight_g_m: 5.5
    color_code: vi    # violett — signal/data
    color_hex: "#8B008B"

  GPT-20:
    label: "20 AWG (0.52mm²)"
    description: "Instrument cluster, relay triggers, light-duty sensors."
    family: SAE J1128 GPT
    gauge: 20 AWG
    cross_section_mm2: 0.52
    od_mm: 1.85
    resistance_ohm_m: 0.0339
    max_amps: 7.5
    weight_g_m: 7.0
    color_code: gr    # grau — instruments
    color_hex: "#808080"

  GPT-18:
    label: "18 AWG (0.82mm²)"
    description: "Marker lights, turn signals, interior accessories."
    family: SAE J1128 GPT
    gauge: 18 AWG
    cross_section_mm2: 0.82
    od_mm: 2.15
    resistance_ohm_m: 0.0210
    max_amps: 10
    weight_g_m: 10.5
    color_code: gn    # grün — lighting
    color_hex: "#008000"

  GPT-16:
    label: "16 AWG (1.31mm²)"
    description: "Headlights, horns, fuel pump, wipers, brake lights."
